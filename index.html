<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Mines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080a10; --panel:#111422; --panel2:#161b2e; --line:#232a45;
    --accent:#8a2be2; --accent-glow:rgba(138,43,226,.4);
    --danger:#ff4d4d; --success:#26e07a;
    --text:#ecedf2; --text-dim:#868ea8;
    --font-d:'Syne',sans-serif; --font-b:'DM Sans',sans-serif; --font-m:'DM Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-b);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ max-width:420px; width:100%; }
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .title{ font-family:var(--font-d); font-weight:800; font-size:1.4rem; letter-spacing:-0.5px; }
  .title span{ color:var(--accent); text-shadow:0 0 10px var(--accent-glow); }
  .header-actions{ display:flex; gap:6px; align-items:center; }
  
  .btn-action{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:.8rem; cursor:pointer; font-family:var(--font-b);
    display:flex; align-items:center; gap:4px; transition:all .15s ease-in-out;
  }
  .btn-action:hover{ border-color:var(--accent); background:var(--panel); transform:translateY(-1px); }

  .saldo{ font-family:var(--font-m); font-size:.85rem; color:var(--text-dim); margin-left:6px; }
  .saldo b{ color:var(--success); text-shadow:0 0 8px rgba(38,224,122,.2); }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }

  .row{ display:flex; gap:10px; margin-bottom:12px; }
  .field{ flex:1; }
  .field label{ display:block; font-family:var(--font-m); font-size:.65rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:var(--font-m); font-size:.9rem; transition:border .15s;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); outline:none; }

  .btn{
    width:100%; border:none; border-radius:8px; padding:14px; font-family:var(--font-d); font-weight:700;
    font-size:.95rem; cursor:pointer; transition:all .2s ease-in-out;
  }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-play{ background:var(--accent); color:#fff; box-shadow:0 4px 15px var(--accent-glow); }
  .btn-play:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 6px 20px var(--accent-glow); }
  .btn-cashout{ background:var(--success); color:#08130c; box-shadow:0 4px 15px rgba(38,224,122,.2); }
  .btn-cashout:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 6px 20px rgba(38,224,122,.3); }

  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .tile{
    aspect-ratio:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:1.4rem; cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .tile:hover:not(.revealed):not(.disabled){ transform:scale(1.05); border-color:var(--accent); box-shadow:0 0 8px var(--accent-glow); }
  .tile.revealed{ cursor:default; }
  .tile.safe{ background:rgba(38,224,122,.12); border-color:var(--success); }
  .tile.mine{ background:rgba(255,77,77,.12); border-color:var(--danger); }
  .tile.disabled{ opacity:.5; cursor:default; }

  .status{ font-family:var(--font-m); font-size:.8rem; color:var(--text-dim); text-align:center; margin-bottom:14px; min-height:1.2em; }
  .status.error{ color:var(--danger); }
  .status.success{ color:var(--success); }

  .potential{ text-align:center; font-family:var(--font-m); font-size:.85rem; color:var(--accent); margin-bottom:10px; min-height:1.2em; }

  /* ESTILOS DO RANKING */
  .rank-list{ max-height:340px; overflow-y:auto; padding-right:6px; margin-bottom:18px; }
  .rank-list::-webkit-scrollbar { width:6px; }
  .rank-list::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  
  .rank-item{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel2); border:1px solid var(--line); padding:10px 14px;
    border-radius:10px; margin-bottom:8px;
  }
  .rank-user{ display:flex; align-items:center; gap:12px; }
  .rank-pos{ font-family:var(--font-d); font-weight:800; font-size:1rem; width:26px; text-align:center; }
  .rank-pos.gold { color:#ffd700; }
  .rank-pos.silver { color:#c0c0c0; }
  .rank-pos.bronze { color:#cd7f32; }
  
  .rank-avatar{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); object-fit:cover; }
  .rank-name{ font-size:.9rem; font-weight:600; color:var(--text); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-val{ font-family:var(--font-m); font-size:.85rem; color:var(--success); font-weight:600; }

  /* ESTILOS DO CALENDÁRIO DIÁRIO */
  .cal-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:20px 0; }
  .cal-day{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:14px 6px; text-align:center; position:relative; transition:all .2s;
  }
  .cal-day.day-7{ grid-column:span 2; }
  .cal-day-num{ font-family:var(--font-d); font-size:.85rem; font-weight:700; display:block; margin-bottom:4px; }
  .cal-day-reward{ font-family:var(--font-m); font-size:.7rem; color:var(--success); display:block; font-weight:600; }
  
  .cal-day.claimed { border-color:var(--success); background:rgba(38,224,122,.08); color:var(--success); }
  .cal-day.claimed::after { content:'✅'; position:absolute; top:2px; right:4px; font-size:.6rem; }
  
  .cal-day.active {
    border-color:var(--accent); background:rgba(138,43,226,.08); color:var(--accent);
    animation: pulseActive 1.6s infinite alternate;
  }
  @keyframes pulseActive {
    from{ box-shadow:0 0 3px rgba(138,43,226,.1); }
    to{ box-shadow:0 0 10px rgba(138,43,226,.3); }
  }
  .cal-day.locked { opacity:.4; }

  /* ESTILOS MULTIPLAYER - NAVEGADOR DE SALAS (ROOM BROWSER) */
  .rooms-container{ max-height:300px; overflow-y:auto; padding-right:4px; margin-bottom:14px; }
  .rooms-container::-webkit-scrollbar { width:6px; }
  .rooms-container::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  
  .room-card{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
    transition:all .2s;
  }
  .room-card:hover{ border-color:var(--accent); }
  .room-info{ display:flex; flex-direction:column; gap:4px; }
  .room-owner{ font-size:.9rem; font-weight:600; color:var(--text); }
  .room-details{ font-size:.7rem; color:var(--text-dim); }
  .room-status{
    padding:4px 8px; border-radius:6px; font-size:.7rem; font-weight:700;
    text-transform:uppercase; margin-bottom:6px; display:inline-block;
  }
  .room-status.lobby { background:rgba(38,224,122,.15); color:var(--success); }
  .room-status.playing { background:rgba(255,77,77,.15); color:var(--danger); }
  
  .room-actions{ display:flex; flex-direction:column; gap:6px; width:100px; }
  .btn-sm{
    padding:8px; border-radius:6px; border:none; cursor:pointer; font-weight:700; font-size:.75rem;
    font-family:var(--font-d); transition:opacity .15s;
  }
  .btn-sm-join{ background:var(--accent); color:#fff; }
  .btn-sm-spec{ background:var(--panel); border:1px solid var(--line); color:var(--text); }

  .potato-lobby-list { display:flex; flex-wrap:wrap; gap:10px; margin:15px 0; max-height:120px; overflow-y:auto; }
  .potato-player {
    display:flex; align-items:center; gap:8px; background:var(--panel2);
    border:1px solid var(--line); padding:6px 12px; border-radius:20px; font-size:.8rem;
  }
  .potato-player img { width:20px; height:20px; border-radius:50%; }
  
  .turn-indicator {
    text-align:center; font-family:var(--font-d); font-weight:700; font-size:1rem;
    color:#ffaa00; margin-bottom:12px; animation: pulseTurn 1s infinite alternate;
  }
  @keyframes pulseTurn {
    from { opacity:.8; transform:scale(1); }
    to { opacity:1; transform:scale(1.03); }
  }

  .loading{ text-align:center; color:var(--text-dim); font-family:var(--font-m); padding:60px 0; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading" id="loadingMsg">conectando com o Discord...</div>
</div>

<script type="module">
  import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2.5.0/output/index.mjs';

  const CLIENT_ID = '1393867072542474391';

  const app = document.getElementById('app');
  let accessToken = null;
  let currentGame = null;
  let dailyTimerInterval = null;
  
  // Sincronizador da Batata Quente
  let potatoSyncInterval = null;
  let myUserId = null;
  let activeRoomId = null;

  async function init(){
    try {
      const discordSdk = new DiscordSDK(CLIENT_ID);
      await discordSdk.ready();

      const { code } = await discordSdk.commands.authorize({
        client_id: CLIENT_ID,
        response_type: 'code',
        state: '',
        prompt: 'none',
        scope: ['identify']
      });

      const tokenResp = await fetch('/api/mines/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const tokenData = await tokenResp.json();
      if (!tokenResp.ok) throw new Error(tokenData.error || 'falha ao trocar token');
      accessToken = tokenData.access_token;

      const auth = await discordSdk.commands.authenticate({ access_token: accessToken });
      myUserId = auth.user.id;

      renderGame();
      refreshState();
    } catch (e) {
      console.error(e);
      app.innerHTML = `<div class="loading" style="color:red; font-size:14px; padding:20px; line-height:1.5;">❌ Erro de conexão:<br><br><b>${e.message || e}</b><br><br>Verifique as portas na Square Cloud e os links no portal.</div>`;
    }
  }

  async function api(path, body){
    const resp = await fetch('/api/mines/' + path, {
      method: body ? 'POST' : 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'erro desconhecido');
    return data;
  }

  function renderGame(){
    app.innerHTML = `
      <div class="top">
        <div class="title">Mi<span>nes</span></div>
        <div class="header-actions">
          <button class="btn-action" id="potatoBtn">🔥 Batata</button>
          <button class="btn-action" id="dailyBtn">🎁 Diário</button>
          <button class="btn-action" id="rankBtn">🏆 Ranking</button>
          <div class="saldo">saldo: <b id="saldoVal">—</b></div>
        </div>
      </div>

      <!-- TELA DE SETUP -->
      <div class="panel" id="setupPanel">
        <div class="row">
          <div class="field">
            <label>Minas (1–15)</label>
            <input type="number" id="mineCount" value="3" min="1" max="15">
          </div>
          <div class="field">
            <label>Aposta</label>
            <input type="number" id="betAmount" value="1" min="0.01" step="0.01">
          </div>
        </div>
        <button class="btn btn-play" id="playBtn">Jogar</button>
      </div>

      <!-- TELA DE TABULEIRO -->
      <div class="panel" id="gamePanel" style="display:none;">
        <div class="potential" id="potentialVal"></div>
        <div class="grid" id="grid"></div>
        <button class="btn btn-cashout" id="cashoutBtn">Sacar</button>
      </div>

      <!-- TELA DE RANKING -->
      <div class="panel" id="leaderboardPanel" style="display:none;">
        <div class="rank-list" id="rankList">
          <div class="loading">carregando o Top 50...</div>
        </div>
        <button class="btn btn-play" id="closeRankBtn">Voltar ao Jogo</button>
      </div>

      <!-- TELA DO CALENDÁRIO DIÁRIO -->
      <div class="panel" id="dailyPanel" style="display:none;">
        <div class="potential" style="color:var(--text); font-weight:600; font-size:.95rem;">Bônus Presença Semanal</div>
        <div class="cal-grid" id="calGrid"></div>
        <button class="btn btn-cashout" id="claimDailyBtn">Resgatar 50 Moedas</button>
        <button class="btn btn-play" id="closeDailyBtn" style="margin-top:8px;">Voltar</button>
      </div>

      <!-- TELA DA BATATA QUENTE (NAVEGADOR DE SALAS) -->
      <div class="panel" id="potatoBrowserPanel" style="display:none;">
        <div class="potential" style="color:var(--text); font-weight:600; font-size:.95rem;">Salas de Batata Quente Ativas</div>
        <div class="rooms-container" id="roomsContainer">
          <div class="loading">Buscando salas...</div>
        </div>
        <button class="btn btn-play" id="openCreateRoomBtn">Criar Nova Sala</button>
        <button class="btn" id="closeBrowserBtn" style="margin-top:8px; background:var(--panel2); border:1px solid var(--line); color:var(--text);">Voltar ao Solo</button>
      </div>

      <!-- POPUP/MODAL CRIADOR DE SALA -->
      <div class="panel" id="potatoCreatePanel" style="display:none;">
        <div class="potential" style="color:var(--text); font-weight:600;">Configurar Minha Sala</div>
        <div class="row">
          <div class="field">
            <label>Custo Entrada</label>
            <input type="number" id="potBetAmount" value="10" min="1">
          </div>
          <div class="field">
            <label>Minas (1-15)</label>
            <input type="number" id="potMineCount" value="3" min="1" max="15">
          </div>
        </div>
        <div class="row" style="margin-bottom:12px;">
          <div class="field">
            <label>Vagas Máximas (2-16)</label>
            <input type="number" id="potMaxPlayers" value="8" min="2" max="16">
          </div>
          <div class="field">
            <label>Tempo do Turno (Segundos)</label>
            <select id="potTurnTimer">
              <option value="5">5 segundos</option>
              <option value="10">10 segundos</option>
              <option value="15" selected>15 segundos</option>
              <option value="20">20 segundos</option>
              <option value="30">30 segundos</option>
              <option value="45">45 segundos</option>
              <option value="60">60 segundos</option>
            </select>
          </div>
        </div>
        <button class="btn btn-cashout" id="submitCreateRoomBtn">Abrir Sala</button>
        <button class="btn" id="cancelCreateRoomBtn" style="margin-top:8px; background:var(--panel2); border:1px solid var(--line); color:var(--text);">Cancelar</button>
      </div>

      <!-- TELA DO TABULEIRO / LOBBY ATIVO DA BATATA QUENTE -->
      <div class="panel" id="potatoPanel" style="display:none;">
        <div class="potential" id="potatoTitle">🔥 Carregando Sala...</div>
        
        <!-- Estado do Lobby Interno -->
        <div id="potatoLobbyZone">
          <div id="potatoConfigZone" style="margin-bottom: 12px;"></div>
          <div class="potato-lobby-list" id="potatoPlayers"></div>
          <button class="btn btn-play" id="startPotatoBtn" style="margin-top:8px;" disabled>Iniciar Partida (Dono)</button>
        </div>

        <!-- Estado Ativo de Jogo -->
        <div id="potatoGameZone" style="display:none;">
          <div class="turn-indicator" id="potatoTurnIndicator">👉 Aguardando...</div>
          <div class="grid" id="potatoGrid"></div>
        </div>

        <button class="btn btn-play" id="leavePotatoBtn" style="margin-top:14px; background:var(--panel2); border:1px solid var(--line); color:var(--text);">Sair da Sala</button>
      </div>

      <div class="status" id="statusMsg"></div>
    `;

    document.getElementById('playBtn').addEventListener('click', startGame);
    document.getElementById('cashoutBtn').addEventListener('click', cashout);
    document.getElementById('rankBtn').addEventListener('click', openLeaderboard);
    document.getElementById('closeRankBtn').addEventListener('click', closeLeaderboard);
    document.getElementById('dailyBtn').addEventListener('click', openDaily);
    document.getElementById('closeDailyBtn').addEventListener('click', closeDaily);
    document.getElementById('claimDailyBtn').addEventListener('click', claimDaily);
    
    // Listeners do Lobby Browser
    document.getElementById('potatoBtn').addEventListener('click', openPotatoBrowser);
    document.getElementById('closeBrowserBtn').addEventListener('click', showSetupPanel);
    document.getElementById('openCreateRoomBtn').addEventListener('click', openCreateRoomModal);
    document.getElementById('cancelCreateRoomBtn').addEventListener('click', openPotatoBrowser);
    document.getElementById('submitCreateRoomBtn').addEventListener('click', submitCreateRoom);
    
    // Listeners do Jogo Interno da Batata
    document.getElementById('startPotatoBtn').addEventListener('click', startPotato);
    document.getElementById('leavePotatoBtn').addEventListener('click', leavePotato);
  }

  function setStatus(msg, type){
    const el = document.getElementById('statusMsg');
    el.textContent = msg || '';
    el.className = 'status' + (type ? ' ' + type : '');
  }

  async function refreshState(){
    try {
      const data = await api('state');
      document.getElementById('saldoVal').textContent = data.saldoFormatado;
      if (data.game) {
        currentGame = data.game;
        showGamePanel();
        drawGrid();
      }
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  // DECLARAÇÃO DAS TROCAS DE TELAS GERAIS
  function showGamePanel(){
    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    document.getElementById('leaderboardPanel').style.display = 'none';
    document.getElementById('dailyPanel').style.display = 'none';
    document.getElementById('potatoPanel').style.display = 'none';
    document.getElementById('potatoBrowserPanel').style.display = 'none';
    document.getElementById('potatoCreatePanel').style.display = 'none';
  }

  function showSetupPanel(){
    document.getElementById('setupPanel').style.display = 'block';
    document.getElementById('gamePanel').style.display = 'none';
    document.getElementById('leaderboardPanel').style.display = 'none';
    document.getElementById('dailyPanel').style.display = 'none';
    document.getElementById('potatoPanel').style.display = 'none';
    document.getElementById('potatoBrowserPanel').style.display = 'none';
    document.getElementById('potatoCreatePanel').style.display = 'none';
    currentGame = null;
  }

  // ==========================================
  // MULTIPLAYER - NAVEGADOR DE SALAS (ROOM BROWSER)
  // ==========================================
  async function openPotatoBrowser(){
    setStatus('');
    if (potatoSyncInterval) clearInterval(potatoSyncInterval);
    activeRoomId = null;

    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'none';
    document.getElementById('leaderboardPanel').style.display = 'none';
    document.getElementById('dailyPanel').style.display = 'none';
    document.getElementById('potatoPanel').style.display = 'none';
    document.getElementById('potatoCreatePanel').style.display = 'none';
    document.getElementById('potatoBrowserPanel').style.display = 'block';

    renderRoomsList();
    potatoSyncInterval = setInterval(renderRoomsList, 2000); // atualiza fita de salas a cada 2 seg
  }

  async function renderRoomsList() {
    try {
      const data = await api('potato/rooms');
      const container = document.getElementById('roomsContainer');
      container.innerHTML = '';

      if (!data.rooms || data.rooms.length === 0) {
        container.innerHTML = `<div class="loading" style="font-size:12px;">Nenhuma sala ativa encontrada.<br>Crie a sua agora mesmo!</div>`;
        return;
      }

      data.rooms.forEach(room => {
        const card = document.createElement('div');
        card.className = 'room-card';

        const stateClass = room.state === 'LOBBY' ? 'lobby' : 'playing';
        const stateText = room.state === 'LOBBY' ? 'Lobby' : 'Em Jogo';

        card.innerHTML = `
          <div class="room-info">
            <span class="room-status ${stateClass}">${stateText}</span>
            <span class="room-owner">Sala de ${room.ownerName}</span>
            <span class="room-details">💰 Aposta: ${room.betAmountFormatted} | Vagas: ${room.playersCount}/${room.maxPlayers}</span>
          </div>
          <div class="room-actions" id="actions-${room.roomId}"></div>
        `;
        container.appendChild(card);

        const actionsDiv = document.getElementById(`actions-${room.roomId}`);

        if (room.state === 'LOBBY') {
          const joinBtn = document.createElement('button');
          joinBtn.className = 'btn-sm btn-sm-join';
          joinBtn.textContent = 'Jogar';
          joinBtn.addEventListener('click', () => joinPotatoRoom(room.roomId));
          actionsDiv.appendChild(joinBtn);
        }

        const specBtn = document.createElement('button');
        specBtn.className = 'btn-sm btn-sm-spec';
        specBtn.textContent = '📺 Assistir';
        specBtn.addEventListener('click', () => spectatePotatoRoom(room.roomId));
        actionsDiv.appendChild(specBtn);
      });
    } catch (e) {
      console.error(e);
    }
  }

  function openCreateRoomModal() {
    if (potatoSyncInterval) clearInterval(potatoSyncInterval);
    document.getElementById('potatoBrowserPanel').style.display = 'none';
    document.getElementById('potatoCreatePanel').style.display = 'block';
  }

  async function submitCreateRoom() {
    const betAmount = parseFloat(document.getElementById('potBetAmount').value);
    const mineCount = parseInt(document.getElementById('potMineCount').value);
    const maxPlayers = parseInt(document.getElementById('potMaxPlayers').value);
    const turnTimer = parseInt(document.getElementById('potTurnTimer').value);
    setStatus('');

    try {
      const data = await api('potato/create', { betAmount, mineCount, maxPlayers });
      if (data.success) {
        activeRoomId = data.roomId;
        // Envia configuração do timer escolhido
        await api('potato/config', { roomId: activeRoomId, turnTimer });
        openPotatoRoom();
      }
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  async function joinPotatoRoom(roomId) {
    try {
      await api('potato/join', { roomId });
      activeRoomId = roomId;
      openPotatoRoom();
    } catch (e) {
      alert(e.message);
    }
  }

  async function spectatePotatoRoom(roomId) {
    try {
      await api('potato/spectate', { roomId });
      activeRoomId = roomId;
      openPotatoRoom();
    } catch (e) {
      alert(e.message);
    }
  }

  // ==========================================
  // LÓGICA DO LOBBY INTERNO / PARTIDA DA BATATA
  // ==========================================
  async function openPotatoRoom() {
    if (potatoSyncInterval) clearInterval(potatoSyncInterval);
    
    document.getElementById('potatoBrowserPanel').style.display = 'none';
    document.getElementById('potatoCreatePanel').style.display = 'none';
    document.getElementById('potatoPanel').style.display = 'block';

    syncPotato();
    potatoSyncInterval = setInterval(syncPotato, 1000); 
  }

  async function syncPotato() {
    if (!activeRoomId) return;
    try {
      const resp = await fetch(`/api/mines/potato/state?roomId=${activeRoomId}`, {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      const data = await resp.json();

      if (!resp.ok) {
        setStatus(data.error || 'A sala foi fechada pelo dono.', 'error');
        closePotato();
        return;
      }

      if (data.state === 'LOBBY') {
        document.getElementById('potatoLobbyZone').style.display = 'block';
        document.getElementById('potatoGameZone').style.display = 'none';
        document.getElementById('potatoTitle').textContent = `🔥 Sala de ${data.players[0].username} (Pote: ${data.potFormatted})`;

        // Configuração de Vagas e Tempo do Dono
        const configZone = document.getElementById('potatoConfigZone');
        const isOwner = data.players.length > 0 && data.players[0].id === myUserId;
        if (isOwner) {
          configZone.innerHTML = `
            <div class="row" style="gap:10px; margin-bottom:12px;">
              <div class="field">
                <label>👥 Limite de Vagas:</label>
                <input type="number" id="potatoMaxPlayersInput" value="${data.maxPlayers}" min="2" max="16" style="padding: 6px 12px; margin-top: 4px;">
              </div>
              <div class="field">
                <label>⏱️ Tempo do Turno:</label>
                <select id="potatoTurnTimerInput" style="padding: 6px 12px; margin-top: 4px;">
                  <option value="5" ${data.turnTimer === 5 ? 'selected' : ''}>5s</option>
                  <option value="10" ${data.turnTimer === 10 ? 'selected' : ''}>10s</option>
                  <option value="15" ${data.turnTimer === 15 ? 'selected' : ''}>15s</option>
                  <option value="20" ${data.turnTimer === 20 ? 'selected' : ''}>20s</option>
                  <option value="30" ${data.turnTimer === 30 ? 'selected' : ''}>30s</option>
                  <option value="60" ${data.turnTimer === 60 ? 'selected' : ''}>60s</option>
                </select>
              </div>
            </div>
          `;
          
          const maxInput = document.getElementById('potatoMaxPlayersInput');
          maxInput.onchange = async (e) => {
            try {
              await api('potato/config', { roomId: activeRoomId, maxPlayers: parseInt(e.target.value) });
            } catch (err) { console.error(err); }
          };

          const timerInput = document.getElementById('potatoTurnTimerInput');
          timerInput.onchange = async (e) => {
            try {
              await api('potato/config', { roomId: activeRoomId, turnTimer: parseInt(e.target.value) });
            } catch (err) { console.error(err); }
          };
        } else {
          configZone.innerHTML = `
            <p style="text-align:center; font-size:.8rem; color:var(--text-dim);">
              👥 Vagas: <b>${data.players.length} de ${data.maxPlayers}</b> | ⏱️ Tempo: <b>${data.turnTimer}s</b>
            </p>
          `;
        }

        // Lista jogadores ativos
        const container = document.getElementById('potatoPlayers');
        container.innerHTML = '';
        data.players.forEach(p => {
          const el = document.createElement('div');
          el.className = 'potato-player';
          el.innerHTML = `<img src="${p.avatarUrl}"> <span>${p.username}</span>`;
          container.appendChild(el);
        });

        // Configura botão de Começar (apenas dono)
        const startBtn = document.getElementById('startPotatoBtn');
        startBtn.disabled = data.players.length < 2 || !isOwner;
      } 
      
      else if (data.state === 'PLAYING') {
        document.getElementById('potatoLobbyZone').style.display = 'none';
        document.getElementById('potatoGameZone').style.display = 'block';
        document.getElementById('potatoTitle').textContent = `🔥 Jogo de ${data.players[0].username} (Prêmio: ${data.potFormatted} | 👀 ${data.spectatorsCount})`;

        // Calcula tempo restante do turno do jogador ativo (Ticking em tempo real)
        const secRemaining = Math.max(0, Math.ceil((data.turnDeadline - Date.now()) / 1000));

        // Quem joga agora?
        const isMyTurn = data.activePlayer.id === myUserId;
        const indicator = document.getElementById('potatoTurnIndicator');
        if (isMyTurn) {
          indicator.innerHTML = `👉 SUA VEZ! Escolha em: <b style="color:var(--danger); font-size:1.15rem; text-shadow:0 0 8px rgba(255,77,77,.3);">${secRemaining}s</b>`;
        } else {
          indicator.innerHTML = `⏳ Vez de: ${data.activePlayer.username} (${secRemaining}s) ...`;
          indicator.style.color = '#ffaa00';
        }

        drawPotatoGrid(data, isMyTurn && !data.isSpectator);
      }

      else if (data.state === 'ENDED') {
        document.getElementById('potatoLobbyZone').style.display = 'none';
        document.getElementById('potatoGameZone').style.display = 'block';
        
        const indicator = document.getElementById('potatoTurnIndicator');
        indicator.textContent = `💥 BOOM! ${data.loser.username} explodiu!`;
        indicator.style.color = 'var(--danger)';

        drawPotatoGrid(data, false);

        let winMsg = '💰 Sobreviventes ganharam:<br>';
        data.winners.forEach(w => {
          winMsg += `<b>${w.username}</b> faturou <b>${w.winShare}</b>!<br>`;
        });
        document.getElementById('potatoTitle').innerHTML = winMsg;

        const isOwner = data.players.length > 0 && data.players[0].id === myUserId;
        const startBtn = document.getElementById('startPotatoBtn');
        
        if (isOwner) {
          document.getElementById('potatoLobbyZone').style.display = 'block';
          document.getElementById('potatoConfigZone').innerHTML = '';
          document.getElementById('potatoPlayers').innerHTML = '';
          startBtn.disabled = false;
          startBtn.textContent = 'Jogar Novamente (Resetar Sala)';
          startBtn.onclick = async () => {
            await api('potato/reset', { roomId: activeRoomId });
            startBtn.textContent = 'Iniciar Partida (Dono)';
            startBtn.onclick = startPotato;
            syncPotato();
          };
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function drawPotatoGrid(data, canClick) {
    const grid = document.getElementById('potatoGrid');
    grid.innerHTML = '';

    for (let i = 0; i < 16; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      
      const isRevealed = data.revealedSquares.includes(i);
      const isMine = data.minePositions.includes(i); 

      if (isRevealed) {
        tile.classList.add('revealed', 'safe');
        tile.textContent = '💎';
      } else if (isMine) {
        tile.classList.add('revealed', 'mine');
        tile.textContent = '💣';
      } else {
        if (canClick && data.state === 'PLAYING') {
          tile.addEventListener('click', () => clickPotato(i));
        } else {
          tile.classList.add('disabled');
        }
      }
      grid.appendChild(tile);
    }
  }

  async function startPotato() {
    setStatus('');
    try {
      await api('potato/start', { roomId: activeRoomId });
      syncPotato();
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  async function clickPotato(index) {
    try {
      await api('potato/click', { roomId: activeRoomId, squareIndex: index });
      syncPotato();
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  async function leavePotato() {
    setStatus('');
    try {
      await api('potato/leave', { roomId: activeRoomId });
      closePotato();
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  function closePotato(){
    if (potatoSyncInterval) clearInterval(potatoSyncInterval);
    activeRoomId = null;
    refreshState();
    showSetupPanel();
  }

  // ==========================================
  // LÓGICA DO CALENDÁRIO DIÁRIO
  // ==========================================
  async function openDaily(){
    setStatus('');
    if (dailyTimerInterval) clearInterval(dailyTimerInterval);

    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'none';
    document.getElementById('leaderboardPanel').style.display = 'none';
    document.getElementById('dailyPanel').style.display = 'block';
    document.getElementById('potatoPanel').style.display = 'none';
    document.getElementById('potatoBrowserPanel').style.display = 'none';

    try {
      const data = await api('daily/state');
      renderDailyCalendar(data);
    } catch (e) {
      setStatus('Erro ao carregar dados do calendário.', 'error');
    }
  }

  function renderDailyCalendar(data) {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const currentStreak = data.streak; // 0 a 7
    const canClaim = data.canClaim;

    for (let day = 1; day <= 7; day++) {
      const dayEl = document.createElement('div');
      dayEl.className = 'cal-day';
      if (day === 7) dayEl.classList.add('day-7');

      dayEl.innerHTML = `
        <span class="cal-day-num">Dia ${day}</span>
        <span class="cal-day-reward">50 moedas</span>
      `;

      if (day <= currentStreak) {
        dayEl.classList.add('claimed');
      } else if (day === currentStreak + 1 && canClaim) {
        dayEl.classList.add('active');
      } else {
        dayEl.classList.add('locked');
      }

      grid.appendChild(dayEl);
    }

    const btn = document.getElementById('claimDailyBtn');
    if (canClaim) {
      btn.disabled = false;
      btn.textContent = 'Resgatar 50 Moedas!';
      btn.className = 'btn btn-cashout';
    } else {
      startDailyTimer(data.cooldown);
    }
  }

  function startDailyTimer(msRemaining) {
    if (dailyTimerInterval) clearInterval(dailyTimerInterval);
    const btn = document.getElementById('claimDailyBtn');
    btn.disabled = true;
    btn.className = 'btn';

    function updateTimer() {
      if (msRemaining <= 0) {
        btn.disabled = false;
        btn.textContent = 'Resgatar 50 Moedas!';
        btn.className = 'btn btn-cashout';
        clearInterval(dailyTimerInterval);
        return;
      }

      const hrs = Math.floor(msRemaining / (1000 * 60 * 60));
      const mins = Math.floor((msRemaining % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((msRemaining % (1000 * 60)) / 1000);

      btn.textContent = `Aguarde: ${hrs}h ${mins}m ${secs}s`;
      msRemaining -= 1000;
    }

    updateTimer();
    dailyTimerInterval = setInterval(updateTimer, 1000);
  }

  async function claimDaily() {
    setStatus('');
    try {
      const data = await api('daily/claim');
      if (data.success) {
        setStatus(`✅ Você resgatou 50 moedas com sucesso! (${data.streak}º dia de sequência)`, 'success');
        document.getElementById('saldoVal').textContent = data.saldoFormatado;
        openDaily();
      }
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  function closeDaily(){
    if (dailyTimerInterval) clearInterval(dailyTimerInterval);
    refreshState();
    showSetupPanel();
  }

  // ==========================================
  // LÓGICA DO LEADERBOARD (RANKING)
  // ==========================================
  async function openLeaderboard(){
    setStatus('');
    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'none';
    document.getElementById('dailyPanel').style.display = 'none';
    document.getElementById('potatoPanel').style.display = 'none';
    document.getElementById('potatoBrowserPanel').style.display = 'none';
    document.getElementById('leaderboardPanel').style.display = 'block';
    document.getElementById('rankList').innerHTML = `<div class="loading">Carregando Top 50...</div>`;
    
    try {
      const data = await api('leaderboard');
      const listContainer = document.getElementById('rankList');
      listContainer.innerHTML = '';

      if (!data.leaderboard || data.leaderboard.length === 0) {
        listContainer.innerHTML = `<div class="loading" style="font-size:12px;">Nenhum jogador encontrado ainda.</div>`;
        return;
      }

      data.leaderboard.forEach(user => {
        let posClass = '';
        let posText = user.position + 'º';
        if (user.position === 1) { posClass = 'gold'; posText = '👑 1'; }
        else if (user.position === 2) { posClass = 'silver'; posText = '🥈 2'; }
        else if (user.position === 3) { posClass = 'bronze'; posText = '🥉 3'; }

        const item = document.createElement('div');
        item.className = 'rank-item';
        item.innerHTML = `
          <div class="rank-user">
            <span class="rank-pos ${posClass}">${posText}</span>
            <img class="rank-avatar" src="${user.avatarUrl}" alt="avatar">
            <span class="rank-name">${user.username}</span>
          </div>
          <span class="rank-val">${user.balanceFormatted}</span>
        `;
        listContainer.appendChild(item);
      });
    } catch (e) {
      document.getElementById('rankList').innerHTML = `<div class="loading" style="color:red; font-size:12px;">Não foi possível carregar o ranking.</div>`;
    }
  }

  function closeLeaderboard(){
    refreshState();
    showSetupPanel();
  }

  function drawGrid(revealMines){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let i = 0; i < 16; i++){
      const tile = document.createElement('div');
      tile.className = 'tile';
      const isRevealed = currentGame.revealedSquares?.includes(i);
      const isMineHere = revealMines?.includes(i);

      if (isRevealed){
        tile.classList.add('revealed', 'safe');
        tile.textContent = '💎';
      } else if (isMineHere){
        tile.classList.add('revealed', 'mine');
        tile.textContent = '💣';
      } else if (revealMines){
        tile.classList.add('disabled');
      } else {
        tile.addEventListener('click', () => reveal(i));
      }
      grid.appendChild(tile);
    }
  }

  async function startGame(){
    const mineCount = parseInt(document.getElementById('mineCount').value);
    const betAmount = parseFloat(document.getElementById('betAmount').value);
    setStatus('');
    try {
      const data = await api('start', { mineCount, betAmount });
      currentGame = data.game;
      document.getElementById('saldoVal').textContent = 'R$ ' + data.saldo.toFixed(2).replace('.', ',');
      showGamePanel();
      drawGrid();
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  async function reveal(index){
    try {
      const data = await api('reveal', { squareIndex: index });
      if (data.hit_mine){
        setStatus('💥 Você pisou numa mina! Perdeu a aposta.', 'error');
        drawGrid(data.minePositions);
        document.getElementById('saldoVal').textContent = 'R$ ' + data.saldo.toFixed(2).replace('.', ',');
        setTimeout(showSetupPanel, 2500);
        return;
      }
      currentGame = data.game;
      document.getElementById('potentialVal').textContent =
        data.potential_win ? `possível ganho: R$ ${data.potential_win.toFixed(2).replace('.', ',')} (${data.multiplier}x)` : '';
      drawGrid();
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  async function cashout(){
    try {
      const data = await api('cashout');
      setStatus(`✅ Sacou R$ ${data.winAmount.toFixed(2).replace('.', ',')} (${data.multiplier}x)`, 'success');
      document.getElementById('saldoVal').textContent = 'R$ ' + data.saldo.toFixed(2).replace('.', ',');
      setTimeout(showSetupPanel, 2000);
    } catch (e) {
      setStatus(e.message, 'error');
    }
  }

  init();
</script>
</body>
</html>
